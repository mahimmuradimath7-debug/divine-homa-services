<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Homa Logo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #e5e7eb;
        }
        .logo-container {
            width: 1024px;
            height: 1024px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 50px; /* Slight rounding, Facebook will crop to circle */
        }
        .icon-container {
            color: white;
            margin-bottom: 40px;
        }
        .icon-container svg {
            width: 400px;
            height: 400px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }
        .logo-text {
            color: white;
            font-size: 100px;
            font-weight: 800;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            letter-spacing: -0.025em;
            text-shadow: 0 10px 15px rgba(0,0,0,0.2);
            text-align: center;
            line-height: 1.1;
        }
        .logo-subtext {
            color: #ffedd5;
            font-size: 40px;
            font-weight: 600;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin-top: 20px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
            </svg>
        </div>
        <div class="logo-text">Divine Homa</div>
        <div class="logo-subtext">Pooja Services</div>
    </div>

</body>
</html>
